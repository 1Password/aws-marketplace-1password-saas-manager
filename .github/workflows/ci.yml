# Checks every pull request and push to main must pass. A weekly run also checks the live
# AWS Marketplace MCP, so a change in its responses is caught before customers see it.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Skill copies in sync
        run: npm run sync-skills -- --check
      - name: Shape and render checks (offline)
        run: npm run check-mcp -- --offline
      - name: Live AWS Marketplace MCP check
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run check-mcp
